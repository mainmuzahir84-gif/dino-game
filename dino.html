<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurassic Escape: Upgraded Dino Runner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #120b18;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #ffffff;
        }

        .game-wrapper {
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 24px;
            letter-spacing: 4px;
            margin-bottom: 10px;
            color: #ff9e3b;
            text-shadow: 0 0 15px rgba(255, 158, 59, 0.5);
            font-weight: 700;
        }

        canvas {
            background: linear-gradient(180deg, #2c163b 0%, #4a1f38 60%, #ff7b54 100%);
            border: 2px solid #5c2c4b;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 123, 84, 0.2);
            border-radius: 14px;
            display: block;
        }

        .hud-panel {
            margin-top: 12px;
            font-size: 13px;
            color: #d1b3c4;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            width: 900px;
            padding: 0 10px;
        }

        .hud-panel span {
            color: #ffca3a;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <h1>JURASSIC ESCAPE</h1>
        <canvas id="gameCanvas" width="900" height="400"></canvas>
        <div class="hud-panel">
            <div>Controls: <span>SPACE / UP</span> (Jump) | <span>DOWN</span> (Duck)</div>
            <div>Restart: <span>ENTER</span></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game State Variables
        let score = 0;
        let highScore = localStorage.getItem('jurassicDinoHighScore') || 0;
        let gameSpeed = 7;
        let isGameOver = false;
        let frameCount = 0;
        let screenShake = 0;

        // Background Parallax Layers (Mountains & Dunes)
        class ParallaxLayer {
            constructor(speedFactor, color, height, yOffset) {
                this.speedFactor = speedFactor;
                this.color = color;
                this.height = height;
                this.yOffset = yOffset;
                this.shapes = [];
                this.init();
            }
            init() {
                let currentX = 0;
                while (currentX < canvas.width + 300) {
                    const width = Math.random() * 90 + 60;
                    const height = Math.random() * this.height + 30;
                    this.shapes.push({ x: currentX, width: width, height: height });
                    currentX += width;
                }
            }
            update() {
                this.shapes.forEach(s => {
                    s.x -= gameSpeed * this.speedFactor;
                });
                if (this.shapes[0].x + this.shapes[0].width < 0) {
                    this.shapes.shift();
                    const lastS = this.shapes[this.shapes.length - 1];
                    const width = Math.random() * 90 + 60;
                    const height = Math.random() * this.height + 30;
                    this.shapes.push({
                        x: lastS.x + lastS.width,
                        width: width,
                        height: height
                    });
                }
            }
            draw() {
                ctx.save();
                ctx.fillStyle = this.color;
                this.shapes.forEach(s => {
                    ctx.beginPath();
                    ctx.moveTo(s.x, canvas.height - this.yOffset);
                    ctx.lineTo(s.x + s.width / 2, canvas.height - s.height - this.yOffset);
                    ctx.lineTo(s.x + s.width, canvas.height - this.yOffset);
                    ctx.closePath();
                    ctx.fill();
                });
                ctx.restore();
            }
        }

        const bgDistant = new ParallaxLayer(0.2, '#311933', 100, 66);
        const bgClose = new ParallaxLayer(0.5, '#4b243b', 140, 66);

        // Clouds
        let clouds = [];
        for(let i=0; i<4; i++) {
            clouds.push({
                x: Math.random() * canvas.width,
                y: Math.random() * 120 + 20,
                width: Math.random() * 60 + 40,
                speed: 0.5 + Math.random() * 0.5
            });
        }

        function handleClouds() {
            ctx.fillStyle = 'rgba(255, 200, 220, 0.25)';
            clouds.forEach(c => {
                c.x -= c.speed;
                if (c.x + c.width < 0) {
                    c.x = canvas.width + 50;
                    c.y = Math.random() * 120 + 20;
                }
                ctx.beginPath();
                ctx.roundRect(c.x, c.y, c.width, 18, 9);
                ctx.fill();
            });
        }

        // Player (Real T-Rex Upgraded Style)
        const dino = {
            x: 100,
            y: 270,
            width: 52,
            height: 64,
            normalHeight: 64,
            duckHeight: 38,
            dy: 0,
            jumpForce: 13.5,
            gravity: 0.65,
            grounded: true,
            isDucking: false,
            draw() {
                ctx.save();
                ctx.fillStyle = '#6bba62'; // Classic vibrant T-Rex green with rich shading
                
                let currentH = this.isDucking ? this.duckHeight : this.normalHeight;
                let currentY = this.isDucking ? this.y + (this.normalHeight - this.duckHeight) : this.y;

                // Soft shadow beneath dino
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 10;

                if (!this.isDucking) {
                    // T-Rex Body Shape (Upgraded Vector Look)
                    ctx.fillRect(this.x + 12, currentY + 22, 28, 28);
                    
                    // Tail
                    ctx.beginPath();
                    ctx.moveTo(this.x + 14, currentY + 26);
                    ctx.lineTo(this.x - 14, currentY + 16);
                    ctx.lineTo(this.x + 14, currentY + 38);
                    ctx.fill();

                    // Head & Snout
                    ctx.fillRect(this.x + 22, currentY + 2, 26, 22);
                    ctx.fillRect(this.x + 40, currentY + 10, 8, 12);

                    // Eye (Expression)
                    ctx.fillStyle = '#1c1c1c';
                    ctx.fillRect(this.x + 36, currentY + 6, 4, 4);

                    // Tiny Arms
                    ctx.fillStyle = '#559c4e';
                    ctx.fillRect(this.x + 34, currentY + 26, 8, 4);

                    // Legs animation
                    ctx.fillStyle = '#559c4e';
                    if (!this.grounded) {
                        ctx.fillRect(this.x + 14, currentY + 50, 8, 16);
                        ctx.fillRect(this.x + 28, currentY + 44, 8, 16);
                    } else {
                        const legFrame = Math.floor(frameCount / 6) % 2;
                        if (legFrame === 0) {
                            ctx.fillRect(this.x + 14, currentY + 50, 8, 14);
                            ctx.fillRect(this.x + 28, currentY + 50, 8, 10);
                        } else {
                            ctx.fillRect(this.x + 14, currentY + 50, 8, 10);
                            ctx.fillRect(this.x + 28, currentY + 50, 8, 14);
                        }
                    }
                } else {
                    // Ducking T-Rex form
                    ctx.fillRect(this.x + 6, currentY + 12, 38, 26);
                    ctx.fillRect(this.x + 32, currentY + 4, 18, 16);
                    ctx.fillStyle = '#1c1c1c';
                    ctx.fillRect(this.x + 42, currentY + 8, 3, 3);
                    
                    // Sliding legs
                    ctx.fillStyle = '#559c4e';
                    ctx.fillRect(this.x + 10, currentY + currentH, 24, 6);
                }

                ctx.restore();
            },
            jump() {
                if (this.grounded && !this.isDucking) {
                    this.dy = -this.jumpForce;
                    this.grounded = false;
                    addDust(this.x + 20, this.y + this.height, 6);
                }
            },
            duck(state) {
                this.isDucking = state;
                if (state && this.grounded) {
                    this.height = this.duckHeight;
                } else if (!state) {
                    this.height = this.normalHeight;
                }
            },
            update() {
                this.dy += this.gravity;
                this.y += this.dy;

                let floorLevel = 270;
                if (this.y > floorLevel) {
                    this.y = floorLevel;
                    this.dy = 0;
                    this.grounded = true;
                }
            }
        };

        // Dust Particles
        let particles = [];
        function addDust(x, y, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 4 - gameSpeed * 0.3,
                    vy: (Math.random() - 0.8) * 3,
                    size: Math.random() * 4 + 2,
                    life: 20
                });
            }
        }

        function handleParticles() {
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.save();
                ctx.fillStyle = 'rgba(255, 220, 200, ' + (p.life / 20) + ')';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                if (p.life <= 0) particles.splice(index, 1);
            });
        }

        // Obstacles (Cacti & Pterodactyls)
        let obstacles = [];
        class Obstacle {
            constructor(type) {
                this.type = type;
                this.x = canvas.width;
                if (this.type === 'cactus') {
                    this.width = Math.random() * 16 + 24;
                    this.height = Math.random() * 35 + 40;
                    this.y = 334 - this.height;
                } else {
                    this.width = 46;
                    this.height = 28;
                    this.y = Math.random() > 0.5 ? 200 : 240; 
                }
            }
            draw() {
                ctx.save();
                if (this.type === 'cactus') {
                    ctx.fillStyle = '#2d6a4f';
                    ctx.fillRect(this.x + this.width * 0.35, this.y, this.width * 0.3, this.height);
                    ctx.fillRect(this.x, this.y + this.height * 0.3, this.width * 0.35, 8);
                    ctx.fillRect(this.x, this.y + this.height * 0.15, 8, this.height * 0.25);
                    ctx.fillRect(this.x + this.width * 0.65, this.y + this.height * 0.45, this.width * 0.35, 8);
                    ctx.fillRect(this.x + this.width * 0.75, this.y + this.height * 0.3, 8, this.height * 0.25);
                    
                    ctx.fillStyle = '#52b788';
                    ctx.fillRect(this.x + this.width * 0.4, this.y + 4, 3, this.height - 8);
                } else {
                    ctx.fillStyle = '#8338ec';
                    ctx.fillRect(this.x + 10, this.y + 8, 26, 14);
                    ctx.fillRect(this.x + 32, this.y + 4, 12, 10);

                    ctx.fillStyle = '#9b5de5';
                    let wingUp = Math.floor(frameCount / 8) % 2 === 0;
                    if (wingUp) {
                        ctx.beginPath();
                        ctx.moveTo(this.x + 15, this.y + 10);
                        ctx.lineTo(this.x + 25, this.y - 12);
                        ctx.lineTo(this.x + 35, this.y + 10);
                        ctx.closePath();
                        ctx.fill();
                    } else {
                        ctx.beginPath();
                        ctx.moveTo(this.x + 15, this.y + 15);
                        ctx.lineTo(this.x + 25, this.y + 32);
                        ctx.lineTo(this.x + 35, this.y + 15);
                        ctx.closePath();
                        ctx.fill();
                    }
                }
                ctx.restore();
            }
            update() {
                this.x -= gameSpeed;
            }
        }

        function handleObstacles() {
            // Spawn rate dynamically tightens slightly as speed/score increases
            let spawnInterval = Math.max(40, 110 - Math.floor(score / 50));
            if (frameCount % spawnInterval === 0) {
                const type = Math.random() > 0.3 ? 'cactus' : 'pterodactyl';
                obstacles.push(new Obstacle(type));
            }

            obstacles.forEach((obs, index) => {
                obs.update();
                obs.draw();

                let pCurrentH = dino.isDucking ? dino.duckHeight : dino.normalHeight;
                let pCurrentY = dino.isDucking ? dino.y + (dino.normalHeight - dino.duckHeight) : dino.y;

                if (
                    dino.x < obs.x + obs.width - 6 &&
                    dino.x + dino.width - 6 > obs.x &&
                    pCurrentY < obs.y + obs.height - 4 &&
                    pCurrentY + pCurrentH > obs.y + 4
                ) {
                    isGameOver = true;
                    screenShake = 14;
                    addDust(dino.x + 20, pCurrentY + pCurrentH / 2, 20);
                }

                if (obs.x + obs.width < 0) {
                    obstacles.splice(index, 1);
                    score += 10;
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('jurassicDinoHighScore', highScore);
                    }
                    
                    // Progressive smooth speed scale-up tied directly to score increase
                    gameSpeed = 7 + Math.floor(score / 30) * 0.35;
                }
            });
        }

        // Ground & Terrain Renderer
        function drawGround() {
            ctx.save();
            ctx.fillStyle = '#5c2c4b';
            ctx.fillRect(0, 334, canvas.width, 66);

            ctx.strokeStyle = '#ffb703';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 334);
            ctx.lineTo(canvas.width, 334);
            ctx.stroke();

            ctx.fillStyle = '#3a1b2f';
            let detailOffset = (frameCount * gameSpeed) % 60;
            for (let x = -detailOffset; x < canvas.width; x += 60) {
                ctx.fillRect(x + 15, 346, 12, 6);
                ctx.fillRect(x + 40, 362, 8, 4);
            }
            ctx.restore();
        }

        function displayHUD() {
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px "Segoe UI", monospace';
            ctx.shadowColor = '#ffb703';
            ctx.shadowBlur = 6;
            ctx.fillText(`SCORE: ${String(score).padStart(6, '0')}`, canvas.width - 170, 35);
            ctx.fillText(`HI: ${String(highScore).padStart(6, '0')}`, canvas.width - 320, 35);
            ctx.restore();
        }

        function resetGame() {
            obstacles = [];
            particles = [];
            score = 0;
            gameSpeed = 7;
            isGameOver = false;
            dino.y = 270;
            dino.dy = 0;
            dino.duck(false);
            frameCount = 0;
            screenShake = 0;
            loop();
        }

        // Input Handling
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (isGameOver) {
                    resetGame();
                } else {
                    dino.jump();
                }
            }
            if (e.code === 'ArrowDown') {
                e.preventDefault();
                if (!isGameOver) {
                    dino.duck(true);
                }
            }
            if (e.code === 'Enter' && isGameOver) {
                resetGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowDown') {
                dino.duck(false);
            }
        });

        // Main Execution Game Loop
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Screen Shake Effect
            ctx.save();
            if (screenShake > 0) {
                let shakeX = (Math.random() - 0.5) * screenShake;
                let shakeY = (Math.random() - 0.5) * screenShake;
                ctx.translate(shakeX, shakeY);
                screenShake *= 0.85;
                if (screenShake < 0.5) screenShake = 0;
            }

            // Render Layers Pipeline
            handleClouds();
            bgDistant.update();
            bgDistant.draw();
            bgClose.update();
            bgClose.draw();

            drawGround();

            dino.update();
            dino.draw();

            handleObstacles();
            handleParticles();
            displayHUD();

            if (isGameOver) {
                ctx.fillStyle = 'rgba(18, 11, 24, 0.82)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ff7b54';
                ctx.shadowColor = '#ff7b54';
                ctx.shadowBlur = 20;
                ctx.font = 'bold 36px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('EXTINCTION EVENT', canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 0;
                ctx.font = '15px "Segoe UI", sans-serif';
                ctx.fillText('PRESS ENTER OR SPACE TO EVOLVE AGAIN', canvas.width / 2, canvas.height / 2 + 25);
                ctx.textAlign = 'left';
                ctx.restore();
                return;
            }

            ctx.restore();
            frameCount++;
            requestAnimationFrame(loop);
        }

        // Initialize game loop
        loop();
    </script>
</body>
</html>
